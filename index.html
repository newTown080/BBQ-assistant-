<p class="sub"><span class="count">640 options</span> · gaz · charbon · fumoir · Blackstone · Ninja Air Fryer</p>

<label>Mode de cuisson</label><select id="mode"></select>

</div>
<div class="card" id="result">Choisis un aliment.</div>

<div class="timer" id="timerDisplay">00:00</div>

</div>

function showInfo(){current=getSel();if(!current){document.getElementById('result').innerHTML='Aucun résultat';return}remaining=current.minutes*60;updateTimer();document.getElementById('result').innerHTML=`<div class="big">${current.name}</div><span class="pill">${current.mode}</span><span class="pill">${current.variant}</span><p>🔥 <b>Réglage:</b> ${current.heat}</p><p>⏱️ <b>Temps estimé:</b> ${current.minutes} min</p><p>🌡️ <b>Interne:</b> <span class="ok">${current.internal}</span></p><div class="recipe"><b>Conseil:</b><br>${current.tip}</div>`;}
function updateTimer(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById('timerDisplay').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
function startTimer(){if(timer)return;if(!current)showInfo();timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);timer=null;alert('⏰ Minuterie terminée! Vérifie la température interne.');}},1000);}
function pauseTimer(){clearInterval(timer);timer=null;}
function resetTimer(){pauseTimer();if(current)remaining=current.minutes*60;updateTimer();}
function saveFav(){if(!current)return;let favs=JSON.parse(localStorage.getItem('favs')||'[]');let key=current.mode+'|'+current.name+'|'+current.variant;if(!favs.includes(key))favs.push(key);localStorage.setItem('favs',JSON.stringify(favs));loadFavs();}
function loadFavs(){let favs=JSON.parse(localStorage.getItem('favs')||'[]');document.getElementById('favs').innerHTML='<option value="">Choisir un favori</option>'+favs.map(x=>`<option>${x}</option>`).join('');}
function openFav(){let v=document.getElementById('favs').value;if(!v)return;let p=v.split('|');mode.value=p[0];document.getElementById('search').value='';loadFoods();food.value=p[1];loadVariants();let idx=items.filter(x=>x.mode===p[0]&&x.name===p[1]).findIndex(x=>x.variant===p[2]);variant.value=idx;showInfo();}
mode.onchange=loadFoods;food.onchange=loadVariants;variant.onchange=showInfo;if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');loadModes();
</script></body></html>
