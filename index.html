<p class="sub"><span class="count">100+ choix</span> · BBQ gaz · charbon · fumoir · Blackstone · Ninja Air Fryer</p>

<select id="cat"></select>

<select id="variant"></select>
<button onclick="showInfo()">Afficher</button>

<div class="card">
<label>Ajuster selon l’épaisseur ou grosse portion</label>
<select id="adjust">

<button class="secondary" onclick="showInfo()">Recalculer la minuterie</button>
</div>

<div class="card result" id="result">Choisis un aliment pour commencer.</div>

<div class="card">
<div class="timer" id="timerDisplay">00:00</div>
<div class="grid">
<button onclick="startTimer()">Démarrer</button>
<button class="secondary" onclick="pauseTimer()">Pause</button>

<button class="danger" onclick="resetTimer()">Réinitialiser</button>

let current = null, remaining = 0, timer = null;

const cat=document.getElementById("cat"), food=document.getElementById("food"), variant=document.getElementById("variant");
function unique(a){return [...new Set(a)]}
function loadCats(){cat.innerHTML=unique(items.map(x=>x.cat)).map(c=>`<option>${c}</option>`).join("");loadFoods();}
function loadFoods(){
 const q=document.getElementById("search").value.toLowerCase();
 const names=unique(items.filter(x=>x.cat===cat.value && (!q || x.name.toLowerCase().includes(q))).map(x=>x.name));
 food.innerHTML=names.map(n=>`<option>${n}</option>`).join("");
 loadVariants();
}
function loadVariants(){
 const list=items.filter(x=>x.cat===cat.value && x.name===food.value);
 variant.innerHTML=list.map((x,i)=>`<option value="${i}">${x.thick}</option>`).join("");
 showInfo();
}
function getSelected(){
 const list=items.filter(x=>x.cat===cat.value && x.name===food.value);
 return list[Number(variant.value)] || list[0];
}
function showInfo(){
 current=getSelected(); if(!current){document.getElementById("result").innerHTML="Aucun résultat.";return;}
 const mult=Number(document.getElementById("adjust").value);
 const mins=Math.max(1, Math.round(current.min*mult));
 remaining=mins*60; updateTimer();
 document.getElementById("result").innerHTML = `
 <div class="big">${current.name}</div>
 <span class="pill">${current.cat}</span><span class="pill">${current.thick}</span>
 <p>🔥 <b>Température / chaleur:</b> ${current.heat}</p>
 <p>⏱️ <b>Temps de base:</b> ${current.time}</p>
 <p>📏 <b>Minuterie ajustée:</b> <span class="warn">${mins} min</span></p>
 <p>🌡️ <b>Température interne:</b> <span class="ok">${current.internal}</span></p>
 <div class="recipe"><b>Conseil / recette rapide:</b><br>${current.tips}</div>`;
}
function updateTimer(){let m=Math.floor(remaining/60),s=remaining%60;document.getElementById("timerDisplay").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;}
function startTimer(){if(timer) return; if(remaining<=0 && current) remaining=Math.round(current.min*Number(document.getElementById("adjust").value))*60; timer=setInterval(()=>{remaining--;updateTimer();if(remaining<=0){clearInterval(timer);timer=null;alert("⏰ Minuterie terminée! Vérifie la température interne.");}},1000);}
function pauseTimer(){clearInterval(timer);timer=null;}
function resetTimer(){pauseTimer(); if(current) remaining=Math.round(current.min*Number(document.getElementById("adjust").value))*60; updateTimer();}
cat.onchange=loadFoods; food.onchange=loadVariants; variant.onchange=showInfo; document.getElementById("adjust").onchange=showInfo;
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}
loadCats();
</script>
